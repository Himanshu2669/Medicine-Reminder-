<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>
<link rel="stylesheet" href="style.css">

<style>
/* 🔥 Extra styling for register page */
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Card animation */
.container {
  animation: fadeIn 0.6s ease-in-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Title glow */
.container h2 {
  text-align: center;
  color: #22c55e;
  margin-bottom: 20px;
}

/* Input focus effect */
input:focus {
  box-shadow: 0 0 10px #22c55e;
}

/* Link style */
a {
  color: #22c55e;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}
</style>

</head>

<body>

<div class="container">
  <h2>Create Account 🚀</h2>

  <input type="text" id="regName" placeholder="Full Name" required><br><br>
  <input type="text" id="regMobile" placeholder="Mobile Number" required><br><br>
  <input type="email" id="regEmail" placeholder="Email Address" required><br><br>
  <input type="password" id="regPass" placeholder="Password" required><br><br>
  <input type="password" id="regConfirm" placeholder="Confirm Password" required><br><br>

  <button onclick="registerUser()">Register</button>

  <p style="text-align:center; margin-top:10px;">
    Already have account? <a href="login.html">Login</a>
  </p>
</div>

<script src="auth.js"></script>

</body>
</html>
